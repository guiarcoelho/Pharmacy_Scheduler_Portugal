# Instance Configuration for Pharmacy Scheduling
# Sample: February 2026

# ============================================
# SCHEDULING PERIOD
# ============================================
report_start: "2026-02-01"  # First day to schedule
report_end: "2026-02-28"    # Last day to schedule
buffer_days: 14             # Extra days for Sunday compensation

# ============================================
# WORKERS
# ============================================
workers:
  - id: A
    name: "Worker A"
    groups: [core]
  
  - id: B
    name: "Worker B"
    groups: [core]
  
  - id: C
    name: "Worker C"
    groups: [core]
  
  - id: D
    name: "Worker D"
    groups: [core]
  
  - id: E
    name: "Worker E"
    groups: [core, night_capable]
  
  - id: F
    name: "Worker F"
    groups: [service_extra]

# ============================================
# SERVICE WEEK CYCLE
# ============================================
service_cycle:
  anchor_monday: "2026-01-05"  # Must be a Monday
  cycle_weeks: 4               # 4-week repeating cycle
  service_week_in_cycle: 3     # Week 4 of each cycle is service week

# ============================================
# LOCALE
# ============================================
locale: "PT"  # Portugal for bank holidays

# ============================================
# COVERAGE DEMAND BY DAY TYPE
# ============================================
demand:
  normal_weekday:
    M: 1
    I: 1
    T: 2  # Total 4 core workers (1 off)
  
  normal_weekend_or_holiday:
    MW: 1
    IW: 1
    TW: 1  # Total 2 core workers (3 off)
  
  service_weekday:
    MS: 1
    IS: 1
    TS: 1
    FS: 1
    NS: 1  # Total 4 core workers (1 off)
  
  service_weekend_or_holiday:
    MSW: 1  # Base MSW from core workers
    ISW: 1
    TSW: 1
    FSW: 1
    NSW: 1  # Total 3 core workers (2 off)
    # Note: Worker F provides extra line (MSW or FSW) separately

# ============================================
# CONSTRAINT RULES
# ============================================
constraints:
  # Daily rest requirement (hours)
  min_daily_rest_hours: 11
  
  # Weekend coupling: core workers work both Sat+Sun or neither
  weekend_coupling_enabled: true
  
  # Sunday compensation for core workers
  sunday_compensation_enabled: true
  
  # Weekly rest soft constraint
  weekly_rest_penalty_enabled: true

# ============================================
# OBJECTIVE WEIGHTS
# ============================================
objective:
  # Work cost weights (per paid minute)
  saturday_weight: 10
  sunday_weight: 14
  holiday_weight: 10
  
  # Weekday excess over 40h per week (per minute)
  weekday_excess_weight: 10
  
  # Weekly rest violation (per worker-week with no days off)
  weekly_rest_penalty: 1000
  
  # Sunday compensation violation (working Sunday then the next weekend)
  sunday_next_weekend_penalty: 3000

  # Soft coverage violations (penalties for missing target counts)
  penalty_low_coverage_m: 4000
  penalty_low_coverage_i: 3500
  
  # Fairness weights
  fairness:
    weekend_minutes: 10
    holiday_minutes: 5
    weekday_excess: 1
    shift_counts: 50

# ============================================
# SOLVER PARAMETERS
# ============================================
solver:
  time_limit_seconds: 900
  num_search_workers: 12    # Parallel search threads
  log_search_progress: true
