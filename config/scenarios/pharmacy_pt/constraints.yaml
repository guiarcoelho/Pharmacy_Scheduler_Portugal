rulebook_version: 1

rules:
  - id: one_shift_per_day
    doc: "At most one shift per worker per day."
    for_each:
      - { var: day, type: day }
      - { var: worker, type: worker }
    let:
      worked_today:
        count_assignments:
          select:
            dims:
              day: { from: "i.day" }
              worker: { from: "i.worker" }
    hard:
      - { lhs: { ref: "worked_today" }, op: "<=", rhs: { const: 1 } }

  - id: coverage_bounds
    doc: "Enforce min/max coverage for all shifts that exist on a given day."
    for_each:
      - { var: day, type: day }
      - { var: shift, type: shift }
    let:
      assigned:
        count_assignments:
          select:
            dims:
              day: { from: "i.day" }
              shift: { from: "i.shift" }
    hard:
      - { lhs: { ref: "assigned" }, op: ">=", rhs: { var: "i.shift.coverage.min" } }
      - { lhs: { ref: "assigned" }, op: "<=", rhs: { var: "i.shift.coverage.max" } }

  - id: soft_fill_to_shift_max
    doc: "Soft-fill to max for any shift labeled soft_fill."
    for_each:
      - { var: day, type: day }
      - var: shift
        type: shift
        where: { "in": ["soft_fill", { "var": "this.labels" }] }
    let:
      assigned:
        count_assignments:
          select:
            dims:
              day: { from: "i.day" }
              shift: { from: "i.shift" }
    soft:
      - units:
          max0:
            sub:
              - { var: "i.shift.coverage.max" }
              - { ref: "assigned" }
        penalty_per_unit: { var: "i.shift.soft_fill_penalty" }

  - id: min_daily_rest
    doc: "No forbidden transitions across consecutive days (min rest 11h)."
    for_each:
      - var: day
        type: day
        where: { "==": [ { "var": "this.has_next_day" }, true ] }
      - { var: worker, type: worker }
      - var: trans
        type: shift_transition
        params: { min_rest_hours: 11 }
    let:
      first:
        count_assignments:
          select:
            dims:
              day: { from: "i.day" }
              worker: { from: "i.worker" }
              shift: { from: "i.trans.from" }
      second:
        count_assignments:
          select:
            dims:
              day: { from: "i.day", offset: 1 }
              worker: { from: "i.worker" }
              shift: { from: "i.trans.to" }
    hard:
      - lhs: { sum: [ { ref: "first" }, { ref: "second" } ] }
        op: "<="
        rhs: { const: 1 }

  - id: weekend_coupling_core
    doc: "Core workers must either work both Sat+Sun or neither."
    for_each:
      - var: day
        type: day
        where:
          and:
            - { "==": [ { "var": "this.is_saturday" }, true ] }
            - { "==": [ { "var": "this.has_next_day" }, true ] }
      - var: worker
        type: worker
        where: { "in": ["core", { "var": "this.groups" }] }
    let:
      sat:
        count_assignments:
          select:
            dims:
              day: { from: "i.day" }
              worker: { from: "i.worker" }
      sun:
        count_assignments:
          select:
            dims:
              day: { from: "i.day", offset: 1 }
              worker: { from: "i.worker" }
    hard:
      - { lhs: { ref: "sat" }, op: "==", rhs: { ref: "sun" } }

  - id: sunday_comp_min_day_off
    doc: "If worked Sunday, require at least 1 weekday off in comp window."
    for_each:
      - var: day
        type: day
        where: { "==": [ { "var": "this.is_sunday" }, true ] }
      - var: worker
        type: worker
        where: { "in": ["core", { "var": "this.groups" }] }
    let:
      sun_work:
        count_assignments:
          select:
            dims:
              day: { from: "i.day" }
              worker: { from: "i.worker" }
      comp_work:
        count_assignments:
          select:
            day_range: { from: "i.day", window: "weekdays_week_of_and_after" }
            dims:
              worker: { from: "i.worker" }
      comp_days:
        range_size: { from: "i.day", window: "weekdays_week_of_and_after" }
    hard:
      - only_if:
          cmp:
            op: ">="
            lhs: { ref: "sun_work" }
            rhs: { const: 1 }
        lhs: { ref: "comp_work" }
        op: "<="
        rhs:
          sub:
            - { ref: "comp_days" }
            - { const: 1 }

  - id: sunday_next_weekend_penalty
    doc: "Penalty if worked Sunday and the next Saturday."
    for_each:
      - var: day
        type: day
        where: { "==": [ { "var": "this.is_sunday" }, true ] }
      - var: worker
        type: worker
        where: { "in": ["core", { "var": "this.groups" }] }
    let:
      sun:
        count_assignments:
          select:
            dims:
              day: { from: "i.day" }
              worker: { from: "i.worker" }
      next_sat:
        count_assignments:
          select:
            dims:
              day: { from: "i.day", offset: "next_saturday" }
              worker: { from: "i.worker" }
    soft:
      - units:
          bool_as_int:
            and:
              - cmp:
                  op: ">="
                  lhs: { ref: "sun" }
                  rhs: { const: 1 }
              - cmp:
                  op: ">="
                  lhs: { ref: "next_sat" }
                  rhs: { const: 1 }
        penalty_per_unit: 3000

  - id: sunday_comp_delayed_penalty
    doc: "Penalty if Sunday worked and week1 weekdays are fully worked."
    for_each:
      - var: day
        type: day
        where: { "==": [ { "var": "this.is_sunday" }, true ] }
      - var: worker
        type: worker
        where: { "in": ["core", { "var": "this.groups" }] }
    let:
      sun:
        count_assignments:
          select:
            dims:
              day: { from: "i.day" }
              worker: { from: "i.worker" }
      week1_work:
        count_assignments:
          select:
            day_range: { from: "i.day", window: "weekdays_same_week" }
            dims:
              worker: { from: "i.worker" }
    soft:
      - units:
          bool_as_int:
            and:
              - cmp:
                  op: ">="
                  lhs: { ref: "sun" }
                  rhs: { const: 1 }
              - cmp:
                  op: "=="
                  lhs: { ref: "week1_work" }
                  rhs: { const: 5 }
        penalty_per_unit: 800

  - id: weekly_no_day_off_penalty
    doc: "Penalty for weeks with no days off (core workers)."
    for_each:
      - { var: week, type: week }
      - var: worker
        type: worker
        where: { "in": ["core", { "var": "this.groups" }] }
    let:
      worked_week:
        count_assignments:
          select:
            day_range: { from: "i.week" }
            dims:
              worker: { from: "i.worker" }
      week_days:
        range_size: { from: "i.week" }
    soft:
      - units:
          bool_as_int:
            cmp:
              op: "=="
              lhs: { ref: "worked_week" }
              rhs: { ref: "week_days" }
        penalty_per_unit: 1000

  - id: cost_saturday
    doc: "Cost per minute on Saturdays (report range only)."
    for_each:
      - var: day
        type: day
        where:
          and:
            - { "==": [ { "var": "this.weekday" }, 5 ] }
            - { "==": [ { "var": "this.in_report_range" }, true ] }
      - { var: shift, type: shift }
    let:
      minutes:
        sum_assignment_attr:
          select:
            dims:
              day: { from: "i.day" }
              shift: { from: "i.shift" }
          attr: "shift.paid_minutes"
    soft:
      - units: { ref: "minutes" }
        penalty_per_unit: 10

  - id: cost_sunday
    doc: "Cost per minute on Sundays (report range only)."
    for_each:
      - var: day
        type: day
        where:
          and:
            - { "==": [ { "var": "this.weekday" }, 6 ] }
            - { "==": [ { "var": "this.in_report_range" }, true ] }
      - { var: shift, type: shift }
    let:
      minutes:
        sum_assignment_attr:
          select:
            dims:
              day: { from: "i.day" }
              shift: { from: "i.shift" }
          attr: "shift.paid_minutes"
    soft:
      - units: { ref: "minutes" }
        penalty_per_unit: 14

  - id: cost_holiday
    doc: "Cost per minute on holidays (report range only)."
    for_each:
