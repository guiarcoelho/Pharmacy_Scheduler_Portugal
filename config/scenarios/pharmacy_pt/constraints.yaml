          attr: "shift.paid_minutes"
    soft:
      - units: { ref: "minutes" }
        penalty_per_unit: 10

  - id: weekday_excess_cost
    doc: "Penalty per minute above 40h weekdays in a week (core workers)."
    for_each:
      - { var: week, type: week }
      - var: worker
        type: worker
        where: { "in": ["core", { "var": "this.groups" }] }
    let:
      weekday_minutes:
        sum_assignment_attr:
          select:
            day_range: { from: "i.week", filter: "weekdays_only" }
            dims:
              worker: { from: "i.worker" }
          attr: "shift.paid_minutes"
      excess:
        max0:
          sub:
            - { ref: "weekday_minutes" }
            - { const: 2400 }
    soft:
      - units: { ref: "excess" }
        penalty_per_unit: 10

  - id: fairness_weekend_minutes
    doc: "Balance weekend minutes across core workers."
    for_each:
      - var: worker
        type: worker
        where: { "in": ["core", { "var": "this.groups" }] }
    let:
      metric:
        sum_assignment_attr:
          select:
            day_range: { filter: "weekend_only" }
            dims:
              worker: { from: "i.worker" }
          attr: "shift.paid_minutes"
      total_metric:
        sum_over:
          iter:
            var: w
            type: worker
            where: { "in": ["core", { "var": "this.groups" }] }
          expr:
            sum_assignment_attr:
              select:
                day_range: { filter: "weekend_only" }
                dims:
                  worker: { from: "i.w" }
              attr: "shift.paid_minutes"
      n_workers:
        count_over:
          iter:
            var: w
            type: worker
            where: { "in": ["core", { "var": "this.groups" }] }
    soft:
      - units:
          abs:
            sub:
              - { mul: [ { ref: "n_workers" }, { ref: "metric" } ] }
              - { ref: "total_metric" }
        penalty_per_unit: 10

  - id: fairness_holiday_minutes
