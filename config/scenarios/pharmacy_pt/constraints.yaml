              - { ref: "total_metric" }
        penalty_per_unit: 5

  - id: fairness_weekday_excess
    doc: "Balance weekday excess (over 40h) across core workers."
    for_each:
      - var: worker
        type: worker
        where: { "in": ["core", { "var": "this.groups" }] }
    let:
      metric:
        sum_over:
          iter:
            var: wk
            type: week
          expr:
            max0:
              sub:
                - sum_assignment_attr:
                    select:
                      day_range: { from: "i.wk", filter: "weekdays_only" }
                      dims:
                        worker: { from: "i.worker" }
                    attr: "shift.paid_minutes"
                - { const: 2400 }
      total_metric:
        sum_over:
          iter:
            var: w
            type: worker
            where: { "in": ["core", { "var": "this.groups" }] }
          expr:
            sum_over:
              iter:
                var: wk
                type: week
              expr:
                max0:
                  sub:
                    - sum_assignment_attr:
                        select:
                          day_range: { from: "i.wk", filter: "weekdays_only" }
                          dims:
                            worker: { from: "i.w" }
                        attr: "shift.paid_minutes"
                    - { const: 2400 }
      n_workers:
        count_over:
          iter:
            var: w
            type: worker
            where: { "in": ["core", { "var": "this.groups" }] }
    soft:
      - units:
          abs:
            sub:
              - { mul: [ { ref: "n_workers" }, { ref: "metric" } ] }
              - { ref: "total_metric" }
        penalty_per_unit: 1

