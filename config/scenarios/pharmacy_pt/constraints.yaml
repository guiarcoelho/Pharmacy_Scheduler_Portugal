          and:
            - { "==": [ { "var": "this.is_holiday" }, true ] }
            - { "==": [ { "var": "this.in_report_range" }, true ] }
      - { var: shift, type: shift }
    let:
      minutes:
        sum_assignment_attr:
          select:
            dims:
              day: { from: "i.day" }
