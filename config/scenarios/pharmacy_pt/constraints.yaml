rulebook_version: 1

filters:
  weekdays_only:
    "<": [ { "var": "day.weekday" }, 5 ]
  weekend_only:
    ">=": [ { "var": "day.weekday" }, 5 ]
  holiday_only:
    "==": [ { "var": "day.is_holiday" }, true ]
  report_range_only:
    "==": [ { "var": "day.in_report_range" }, true ]

windows:
  weekdays_same_week:
    anchor: week_monday
    start_offset: 0
    end_offset: 4
    filter: weekdays_only
  weekdays_week_of_and_after:
    anchor: week_monday
    start_offset: 0
    end_offset: 11
    filter: weekdays_only

fairness_items:
  - id: weekend_minutes
    metric:
      sum_assignment_attr:
        select:
          day_range: { filter: "weekend_only" }
          dims:
            worker: { from: "i.worker" }
        attr: "shift.paid_minutes"
    penalty_per_unit: 30

  - id: holiday_minutes
    metric:
      sum_assignment_attr:
        select:
          day_range: { filter: "holiday_only" }
          dims:
            worker: { from: "i.worker" }
        attr: "shift.paid_minutes"
    penalty_per_unit: 50

  - id: shift_counts
    per_shift:
      where: { "in": ["fairness", { "var": "shift.labels" }] }
    metric:
      count_assignments:
        select:
          dims:
            worker: { from: "i.worker" }
          where:
            "==": [ { "var": "shift.code" }, { "var": "i.shift.code" } ]
    penalty_per_unit: 5

  - id: total_shift_counts
    metric:
      count_assignments:
        select:
          dims:
            worker: { from: "i.worker" }
    penalty_per_unit: 15

rules:
  - id: one_shift_per_day
    doc: "At most one shift per worker per day."
    for_each:
      - { var: day, type: day }
      - { var: worker, type: worker }
    let:
      worked_today:
        count_assignments:
          select:
            dims:
              day: { from: "i.day" }
              worker: { from: "i.worker" }
    hard:
      - { lhs: { ref: "worked_today" }, op: "<=", rhs: { const: 1 } }

  - id: coverage_bounds
    doc: "Enforce min/max coverage for all shifts that exist on a given day."
    for_each:
      - { var: day, type: day }
      - { var: shift, type: shift }
    let:
      assigned:
        count_assignments:
          select:
            dims:
              day: { from: "i.day" }
              shift: { from: "i.shift" }
    hard:
      - { lhs: { ref: "assigned" }, op: ">=", rhs: { var: "i.shift.coverage.min" } }
      - only_if:
          jsonlogic:
            "==": [ { "var": "i.shift.coverage.has_max" }, true ]
        lhs: { ref: "assigned" }
        op: "<="
        rhs: { var: "i.shift.coverage.max" }

  - id: soft_fill_to_shift_max
    doc: "Soft-fill to max for any shift labeled soft_fill."
    for_each:
      - { var: day, type: day }
      - var: shift
        type: shift
        where: { "in": ["soft_fill", { "var": "this.labels" }] }
    let:
      assigned:
        count_assignments:
          select:
            dims:
              day: { from: "i.day" }
              shift: { from: "i.shift" }
    soft:
      - units:
          max0:
            sub:
              - { var: "i.shift.coverage.max" }
              - { ref: "assigned" }
        only_if:
          jsonlogic:
            "==": [ { "var": "i.shift.coverage.has_max" }, true ]
        penalty_per_unit: { var: "i.shift.soft_fill_penalty" }

  - id: min_daily_rest
    doc: "No forbidden transitions across consecutive days (min rest 11h)."
    for_each:
      - var: day
        type: day
        where: { "==": [ { "var": "this.has_next_day" }, true ] }
      - { var: worker, type: worker }
      - var: trans
        type: shift_transition
        params: { min_rest_hours: 11 }
    let:
      first:
        count_assignments:
          select:
            dims:
              day: { from: "i.day" }
              worker: { from: "i.worker" }
              shift: { from: "i.trans.from" }
      second:
        count_assignments:
          select:
            dims:
              day: { from: "i.day", offset: 1 }
              worker: { from: "i.worker" }
              shift: { from: "i.trans.to" }
    hard:
      - lhs: { sum: [ { ref: "first" }, { ref: "second" } ] }
        op: "<="
        rhs: { const: 1 }

  - id: weekend_coupling_core
    doc: "Core/management workers must either work both Sat+Sun or neither."
    for_each:
      - var: day
        type: day
        where:
          and:
            - { "==": [ { "var": "this.is_saturday" }, true ] }
            - { "==": [ { "var": "this.has_next_day" }, true ] }
      - var: worker
        type: worker
        where:
          or:
            - { "in": ["core", { "var": "this.groups" }] }
            - { "in": ["management", { "var": "this.groups" }] }
    let:
      sat:
        count_assignments:
          select:
            dims:
              day: { from: "i.day" }
              worker: { from: "i.worker" }
      sun:
        count_assignments:
          select:
            dims:
              day: { from: "i.day", offset: 1 }
              worker: { from: "i.worker" }
    hard:
      - only_if:
          jsonlogic:
            and:
              - "!":
                  in:
                    - { "var": "day.date" }
                    - { "var": "worker.vacation_days" }
              - "!":
                  in:
                    - { "var": "day.next_date" }
                    - { "var": "worker.vacation_days" }
        lhs: { ref: "sat" }
        op: "=="
        rhs: { ref: "sun" }

  - id: sunday_comp_min_day_off
    doc: "If worked Sunday, require at least 1 weekday off in comp window."
    for_each:
      - var: day
        type: day
        where: { "==": [ { "var": "this.is_sunday" }, true ] }
      - var: worker
        type: worker
        where:
          or:
            - { "in": ["core", { "var": "this.groups" }] }
            - { "in": ["management", { "var": "this.groups" }] }
    let:
      sun_work:
        count_assignments:
          select:
            dims:
              day: { from: "i.day" }
              worker: { from: "i.worker" }
      comp_work:
        count_assignments:
          select:
            day_range: { from: "i.day", window: "weekdays_week_of_and_after" }
            dims:
              worker: { from: "i.worker" }
      comp_days:
        range_size: { from: "i.day", window: "weekdays_week_of_and_after" }
    hard:
      - only_if:
          cmp:
            op: ">="
            lhs: { ref: "sun_work" }
            rhs: { const: 1 }
        lhs: { ref: "comp_work" }
        op: "<="
        rhs:
          sub:
            - { ref: "comp_days" }
            - { const: 1 }

  - id: sunday_next_weekend_penalty
    doc: "Penalty if worked Sunday and the next Saturday."
    for_each:
      - var: day
        type: day
        where: { "==": [ { "var": "this.is_sunday" }, true ] }
      - var: worker
        type: worker
        where:
          or:
            - { "in": ["core", { "var": "this.groups" }] }
            - { "in": ["management", { "var": "this.groups" }] }
    let:
      sun:
        count_assignments:
          select:
            dims:
              day: { from: "i.day" }
              worker: { from: "i.worker" }
      next_sat:
        count_assignments:
          select:
            dims:
              day: { from: "i.day", offset: "next_saturday" }
              worker: { from: "i.worker" }
    soft:
      - units:
          bool_as_int:
            and:
              - cmp:
                  op: ">="
                  lhs: { ref: "sun" }
                  rhs: { const: 1 }
              - cmp:
                  op: ">="
                  lhs: { ref: "next_sat" }
                  rhs: { const: 1 }
        penalty_per_unit: 5000

  - id: sunday_comp_delayed_penalty
    doc: "Penalty if Sunday worked and week1 weekdays are fully worked."
    for_each:
      - var: day
        type: day
        where: { "==": [ { "var": "this.is_sunday" }, true ] }
      - var: worker
        type: worker
        where:
          or:
            - { "in": ["core", { "var": "this.groups" }] }
            - { "in": ["management", { "var": "this.groups" }] }
    let:
      sun:
        count_assignments:
          select:
            dims:
              day: { from: "i.day" }
              worker: { from: "i.worker" }
      week1_work:
        count_assignments:
          select:
            day_range: { from: "i.day", window: "weekdays_same_week" }
            dims:
              worker: { from: "i.worker" }
    soft:
      - units:
          bool_as_int:
            and:
              - cmp:
                  op: ">="
                  lhs: { ref: "sun" }
                  rhs: { const: 1 }
              - cmp:
                  op: "=="
                  lhs: { ref: "week1_work" }
                  rhs: { const: 5 }
        penalty_per_unit: 800

  - id: weekly_no_day_off_penalty
    doc: "Penalty for weeks with no days off (core/management workers)."
    for_each:
      - { var: week, type: week }
      - var: worker
        type: worker
        where:
          or:
            - { "in": ["core", { "var": "this.groups" }] }
            - { "in": ["management", { "var": "this.groups" }] }
    let:
      worked_week:
        count_assignments:
          select:
            day_range: { from: "i.week" }
            dims:
              worker: { from: "i.worker" }
      week_days:
        range_size: { from: "i.week" }
    soft:
      - units:
          bool_as_int:
            cmp:
              op: "=="
              lhs: { ref: "worked_week" }
              rhs: { ref: "week_days" }
        penalty_per_unit: 1000

  - id: min_weekly_hours
    doc: "Hard minimum weekly hours prorated by available (non-vacation) days."
    for_each:
      - var: week
        type: week
        where:
          "==": [ { "var": "this.size" }, 7 ]
      - var: worker
        type: worker
        where: { "in": ["core", { "var": "this.groups" }] }
    let:
      worked_minutes:
        sum_assignment_attr:
          select:
            day_range: { from: "i.week" }
            dims:
              worker: { from: "i.worker" }
          attr: "shift.paid_minutes"
      eligible_days:
        count_if:
          iter:
            var: d
            type: day
            where:
              and:
                - { "==": [ { "var": "this.week_id" }, { "var": "i.week.id" } ] }
                - "!":
                    in:
                      - { "var": "this.date" }
                      - { "var": "i.worker.vacation_days" }
          expr:
            exists_over:
              iter:
                var: s
                type: shift
              expr:
                and:
                  - jsonlogic_eval:
                      expr: "i.s.allowed_when"
                      bindings:
                        day: "i.d"
                        shift: "i.s"
                      default: true
                  - jsonlogic_eval:
                      expr: "i.worker.allowed_when"
                      bindings:
                        day: "i.d"
                        shift: "i.s"
                        worker: "i.worker"
                      default: true
                  - caps_match:
                      worker: "i.worker"
                      shift: "i.s"
    hard:
      - lhs:
          mul: [ { ref: "worked_minutes" }, { const: 7 } ]
        op: ">="
        rhs:
          mul: [ { const: 2400 }, { ref: "eligible_days" } ]

  - id: fairness_generic
    doc: "Balance metrics listed in fairness_items across core/management workers."
    for_each:
      - var: fairness
        type: list
        from: fairness_items
      - var: worker
        type: worker
        where:
          or:
            - { "in": ["core", { "var": "this.groups" }] }
            - { "in": ["management", { "var": "this.groups" }] }
    let:
      metric:
        with:
          bindings:
            shift: "i.fairness.shift"
          expr:
            eval: { var: "i.fairness.metric" }
      total_metric:
        sum_over:
          iter:
            var: w
            type: worker
            where:
              or:
                - { "in": ["core", { "var": "this.groups" }] }
                - { "in": ["management", { "var": "this.groups" }] }
          expr:
            with:
              bindings:
                worker: "i.w"
                shift: "i.fairness.shift"
              expr:
                eval: { var: "i.fairness.metric" }
      avail:
        count_over:
          iter:
            var: d
            type: day
            where:
              and:
                - { "==": [ { "var": "this.in_report_range" }, true ] }
                - "!":
                    in:
                      - { "var": "this.date" }
                      - { "var": "i.worker.vacation_days" }
      total_avail:
        sum_over:
          iter:
            var: w
            type: worker
            where:
              or:
                - { "in": ["core", { "var": "this.groups" }] }
                - { "in": ["management", { "var": "this.groups" }] }
          expr:
            with:
              bindings:
                worker: "i.w"
              expr:
                count_over:
                  iter:
                    var: d
                    type: day
                    where:
                      and:
                        - { "==": [ { "var": "this.in_report_range" }, true ] }
                        - "!":
                            in:
                              - { "var": "this.date" }
                              - { "var": "i.worker.vacation_days" }
    soft:
      - units:
          abs:
            sub:
              - { mul: [ { ref: "metric" }, { ref: "total_avail" } ] }
              - { mul: [ { ref: "total_metric" }, { ref: "avail" } ] }
        penalty_per_unit: { var: "i.fairness.penalty_per_unit" }
