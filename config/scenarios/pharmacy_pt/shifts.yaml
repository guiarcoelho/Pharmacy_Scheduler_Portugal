shifts:
  # Shifts define:
  # - time window (start/end, and optional clock_end for rest rules)
  # - optional unpaid_break_minutes (subtracted from paid minutes)
  # - coverage bounds (min/max workers needed)
  # - JSONLogic `allowed_when` that decides if the shift exists on a given day
  # - optional `requires_worker_caps` matched against worker `caps`
  #
  # Coverage softness can be configured per shift (e.g., soft-fill to max)
  # via `labels: [soft_fill]` and an optional `soft_fill_penalty`.
  #
  # Normal weekday shifts
  - code: M
    name: "Manhã (Morning)"
    start: "08:30"
    end: "17:30"
    unpaid_break_minutes: 60
    labels: [weekday, normal, soft_fill, fairness]
    coverage: { min: 2, max: 3}
    soft_fill_penalty: 3750
    allowed_when:
      and:
        - { "in": [ { "var": "day.weekday" }, [0,1,2,3,4] ] }
        - { "==": [ { "var": "day.is_holiday" }, false ] }
        - { "!": { "in": ["service", { "var": "day.special_tags" }] } }

  - code: I
    name: "Intermédio (Intermediate)"
    start: "10:30"
    end: "19:30"
    unpaid_break_minutes: 60
    labels: [weekday, normal, soft_fill, fairness]
    coverage: { min: 0, max: 1}
    soft_fill_penalty: 3500
    allowed_when:
      and:
        - { "in": [ { "var": "day.weekday" }, [0,1,2,3,4] ] }
        - { "==": [ { "var": "day.is_holiday" }, false ] }
        - { "!": { "in": ["service", { "var": "day.special_tags" }] } }

  - code: T
    name: "Tarde (Afternoon)"
    start: "11:30"
    end: "20:30"
    unpaid_break_minutes: 60
    labels: [weekday, normal, fairness]
    coverage: { min: 2}
    allowed_when:
      and:
        - { "in": [ { "var": "day.weekday" }, [0,1,2,3,4] ] }
        - { "==": [ { "var": "day.is_holiday" }, false ] }
        - { "!": { "in": ["service", { "var": "day.special_tags" }] } }

  # Normal weekend / holiday shifts
  - code: MW
    name: "Manhã Weekend"
    start: "08:30"
    end: "15:30"
    unpaid_break_minutes: 60
    labels: [weekend, normal, fairness]
    coverage: { min: 1, max: 1}
    allowed_when:
      and:
        - { "or": [
              { "in": [ { "var": "day.weekday" }, [5,6] ] },
              { "==": [ { "var": "day.is_holiday" }, true ] }
            ] }
        - { "!": { "in": ["service", { "var": "day.special_tags" }] } }

  - code: IW
    name: "Intermédio Weekend"
    start: "10:30"
    end: "17:30"
