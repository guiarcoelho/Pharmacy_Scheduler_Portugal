# Shift Definitions for Portuguese Pharmacy Scheduling
# All times in HH:MM format (24-hour)

shifts:
  # ============================================
  # NORMAL WEEKDAY SHIFTS (Mon-Fri, not service week)
  # ============================================
  - code: M
    name: "Manhã (Morning)"
    start: "08:30"
    end: "17:30"
    tags: [weekday, normal]
  
  - code: I
    name: "Intermédio (Intermediate)"
    start: "10:30"
    end: "19:30"
    tags: [weekday, normal]
  
  - code: T
    name: "Tarde (Afternoon)"
    start: "11:30"
    end: "20:30"
    tags: [weekday, normal]

  # ============================================
  # NORMAL WEEKEND/HOLIDAY SHIFTS
  # ============================================
  - code: MW
    name: "Manhã Weekend"
    start: "08:30"
    end: "15:30"
    tags: [weekend, normal]
  
  - code: IW
    name: "Intermédio Weekend"
    start: "10:30"
    end: "17:30"
    tags: [weekend, normal]
  
  - code: TW
    name: "Tarde Weekend"
    start: "16:30"
    end: "20:30"
    tags: [weekend, normal]

  # ============================================
  # SERVICE WEEKDAY SHIFTS
  # ============================================
  - code: MS
    name: "Manhã Serviço"
    start: "09:00"
    end: "18:00"
    tags: [weekday, service]
  
  - code: IS
    name: "Intermédio Serviço"
    start: "13:00"
    end: "22:00"
    tags: [weekday, service]
  
  - code: TS
    name: "Tarde Serviço"
    start: "16:00"
    end: "00:00"  # Paid until midnight
    clock_end: "23:59"  # For rest calculations
    tags: [weekday, service, late]
  
  - code: NS
    name: "Noite Serviço"
    start: "00:00"
    end: "08:30"
    tags: [weekday, service, night]

  # ============================================
  # SERVICE WEEKEND/HOLIDAY SHIFTS
  # ============================================
  - code: MSW
    name: "Manhã Serviço Weekend"
    start: "08:30"
    end: "13:30"
    tags: [weekend, service]
  
  - code: ISW
    name: "Intermédio Serviço Weekend"
    start: "14:00"
    end: "22:00"
    tags: [weekend, service]
  
  - code: TSW
    name: "Tarde Serviço Weekend"
    start: "16:00"
    end: "00:00"  # Paid until midnight
    clock_end: "23:59"  # For rest calculations
    tags: [weekend, service, late]
  
  - code: NSW
    name: "Noite Serviço Weekend"
    start: "00:00"
    end: "08:30"
    tags: [weekend, service, night]
  
  - code: FSW
    name: "Fim de Semana Serviço (Extra)"
    start: "09:30"
    end: "16:30"
    tags: [weekend, service, extra]
